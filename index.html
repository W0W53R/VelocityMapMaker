<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Velocity Map Maker</title>
        <link rel="stylesheet" href="style.css">
        <script src="draw.js"></script>
        <script src="main.js"></script>
    </head>
    <body>
        <canvas id="main"></canvas>
        <div id="tools">
            <div class="tool icon selected" id="pan"></div>
            <div class="tool icon" id="delete"></div>
            <div class="tool icon" id="hammer"></div>
            <div class="tool icon" id="door"></div>
            <div class="tool icon" id="button"></div>
            <div class="tool icon" id="home"></div>
            <div class="tool icon" id="exit"></div>
            <div class="tool icon" id="download"></div>
            <div class="tool icon" id="upload"></div>
            <div class="tool icon" id="restart"></div>
        </div>
        <div id="sidebar">
            <div class="tool icon" id="layerup"></div>
            <div class="tool icon" id="layercenter"></div>
            <div class="tool icon" id="layerdown"></div>
        </div>
    </body>
</html>
